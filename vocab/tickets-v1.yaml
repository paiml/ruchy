# RHL-0 pre-registered vocabulary (RHL-001 §3.4). No RHL compiler code exists
# yet — `lowers_to` stays the unbound marker `[U]` on every term until RHL-3
# binds it. Domain: filing and labelling a ticket in a repo (RHL-001 §3.2's
# worked example calls `file ticket in repo … title … label …`).
#
# Sigma binding: see vocab/fleet-v1.yaml's header comment for the full
# reasoning (paiml-ontology.md ONT-001 v4.9 §3.1). The vocabulary FILE is the
# Sigma entity, with its TYPE unbound — an earlier revision said `pv-contract`
# and that value is RETRACTED; `kind:` below is RHL's own closed list, not a
# Sigma class — no per-term `sigma_class` field.
# sigma_entity: "[U]" — NOT bound, deliberately. RHL-13, 2026-09-20.
#
# This first read `sigma_entity: pv-contract`. Two sessions independently say that
# is wrong, for different reasons: apex has no `pv-contract` type at all (it is
# sovereign and uses domain types), and infra reads ONT-001 §3.1 as putting a
# vocabulary file under `documents` or `data files` depending on its format.
# ONT-001's `pv-contract` is "a contract about contracts", and a term registry is
# not a contract.
#
# Rather than swap one guess for another: ONT-001 §3.7 says every entity type
# names its EXTRACTOR, and there is no extractor for a YAML term registry. So the
# honest state is that this file is a Σ entity whose type is not yet in Σ, and
# adding one is an ONT-001 row, not a ruchy decision. Candidates are `documents`
# and `data files`. Binding it is RHL-2's work, with whoever owns Σ.
sigma_entity: "[U]"

vocabulary: tickets
version: 1
terms:
  - term: file ticket
    kind: action
    takes: [{name: repo, type: Text}]
    gives: Ticket
    effect: write tickets
    lowers_to: "[U]"          # bound at RHL-3
    contract: contracts/rhl-tickets-file-ticket-v1.yaml

  - term: label ticket
    kind: action
    takes: [{name: ticket, type: Ticket}, {name: label, type: Text}]
    gives: Ticket
    effect: write tickets
    lowers_to: "[U]"
    contract: contracts/rhl-tickets-label-ticket-v1.yaml

  - term: repo
    kind: entity
    instances_from: org/repos/*.yaml         # closed world: only declared org repos exist
    lowers_to: "[U]"
    contract: contracts/rhl-tickets-repo-v1.yaml

  - term: ticket title
    kind: noun
    gives: Text
    lowers_to: "[U]"
    contract: contracts/rhl-tickets-ticket-title-v1.yaml

  - term: ticket label
    kind: noun
    gives: Text
    lowers_to: "[U]"
    contract: contracts/rhl-tickets-ticket-label-v1.yaml

  - term: tickets filed in
    kind: measure
    takes: [{name: repo, type: Text}]
    gives: Count
    effect: read tickets
    lowers_to: "[U]"
    contract: contracts/rhl-tickets-tickets-filed-in-v1.yaml
