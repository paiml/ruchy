# Release workflow.
#
# Job order: create-release -> (build-binaries, build-wasm) -> release-policy.
# CI builds the artifacts, attaches them to the GitHub release, marks a tag carrying a
# pre-release suffix as a pre-release, and then checks the release policy. CI never
# ships a crate to the registry: the operator publishes by hand from their machine with
# a scoped token, so no registry credential lives in this repository (PMAT-135).
name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Create GitHub release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          # v5.0.0-beta.2 is a pre-release; v5.0.0 is not (PMAT-093)
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Build and upload binaries
  build-binaries:
    name: Build Binaries
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/ruchy.exe ruchy-${{ matrix.suffix }}
          else
            cp target/${{ matrix.target }}/release/ruchy ruchy-${{ matrix.suffix }}
          fi
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./ruchy-${{ matrix.suffix }}
          asset_name: ruchy-${{ matrix.suffix }}
          asset_content_type: application/octet-stream

  # Build and upload WASM artifacts
  build-wasm:
    name: Build WASM
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-release-${{ hashFiles('**/Cargo.lock') }}
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build WASM package
        env:
          # getrandom 0.3 (rand 0.9 via aprender-core) needs the wasm_js backend on wasm32 (PMAT-129)
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: wasm-pack build --target web --no-default-features --features wasm-compile
        timeout-minutes: 10
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Rename WASM artifacts with version
        run: |
          cd pkg
          mv ruchy_bg.wasm ruchy-${{ steps.get_version.outputs.VERSION }}.wasm
          mv ruchy.js ruchy-${{ steps.get_version.outputs.VERSION }}.js
          mv ruchy_bg.wasm.d.ts ruchy-${{ steps.get_version.outputs.VERSION }}_bg.wasm.d.ts
      - name: Generate SHA256 checksums
        run: |
          cd pkg
          sha256sum ruchy-${{ steps.get_version.outputs.VERSION }}.wasm > checksums.txt
          sha256sum ruchy-${{ steps.get_version.outputs.VERSION }}.js >> checksums.txt
          sha256sum ruchy-${{ steps.get_version.outputs.VERSION }}_bg.wasm.d.ts >> checksums.txt
          cat checksums.txt
      - name: Upload WASM binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./pkg/ruchy-${{ steps.get_version.outputs.VERSION }}.wasm
          asset_name: ruchy-${{ steps.get_version.outputs.VERSION }}.wasm
          asset_content_type: application/wasm
      - name: Upload JavaScript bindings
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./pkg/ruchy-${{ steps.get_version.outputs.VERSION }}.js
          asset_name: ruchy-${{ steps.get_version.outputs.VERSION }}.js
          asset_content_type: application/javascript
      - name: Upload TypeScript definitions
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./pkg/ruchy-${{ steps.get_version.outputs.VERSION }}_bg.wasm.d.ts
          asset_name: ruchy-${{ steps.get_version.outputs.VERSION }}_bg.wasm.d.ts
          asset_content_type: text/plain
      - name: Upload checksums
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./pkg/checksums.txt
          asset_name: ruchy-${{ steps.get_version.outputs.VERSION }}-wasm-checksums.txt
          asset_content_type: text/plain

  # Release policy gate (PMAT-135).
  # CI is the gate; the operator is the publisher. "CI held a publish credential" is
  # the mechanism behind the 403 that stopped the 5.0.0-beta.2 release, and a workflow
  # that gates AND ships is one program attesting to itself. This job runs last and
  # refuses the release if any workflow regains the ability to push a crate, if a
  # registry credential is configured on the repo or the org, or if the tag's
  # clean-room / dogfood / fresh-container receipts are not attached to the release.
  release-policy:
    name: Release Policy
    runs-on: ubuntu-latest
    needs: [create-release, build-binaries, build-wasm]
    steps:
      - uses: actions/checkout@v4
        with:
          # the receipts gate resolves the tag to a commit with git rev-parse
          fetch-depth: 0
      - name: Enforce release policy
        run: bash scripts/release-policy.sh --tag "${GITHUB_REF_NAME}"
