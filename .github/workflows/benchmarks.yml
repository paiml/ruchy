# Benchmark CI — runs the benchmarks and keeps their raw output. It does NOT gate.
#
# CIBASE-1 (2026-09-20) rewrote this file. What it previously claimed, and what it
# actually did, measured:
#
#   `baseline-comparison`   claimed to compare the PR against its base and compute
#                           effect sizes. MEASURED: 17 of 17 runs on a PR branch
#                           FAILED, and every one died on its first step with
#                           `fatal: invalid reference: main` — `actions/checkout`
#                           leaves the base branch as `origin/main`, not `main`,
#                           so `git checkout main -- benches/` cannot resolve. It
#                           has never compared anything on any PR, while reporting
#                           a result. Removed; see the ticket below.
#
#                           Two further layers, had it ever run: `git checkout
#                           <ref> -- benches/` swaps only `benches/` and leaves
#                           `src/` at the PR's code, so the "baseline" would have
#                           been the PR's library with the base's harness — not a
#                           baseline. And the "Comparison Results" it echoed
#                           ("effect sizes (Cohen's d)", "threshold |d| > 0.5")
#                           were echoed strings; nothing computed a d and nothing
#                           thresholded on one.
#
#   `Generate benchmark report`  wrote a markdown table HEADER and never a row,
#                           under a "Statistical Summary" heading, and echoed a
#                           Configuration block (samples, confidence level, warmup)
#                           that it neither set nor read. Removed.
#
#   `Check for regressions` was `echo` plus two comment lines claiming to "fail if
#                           any benchmark regressed by more than 10%". It had no
#                           implementation and always passed. Removed.
#
#   `|| true` on the run    swallowed every benchmark failure. The benches DO
#                           compile today (12 targets, verified), so it was hiding
#                           nothing at the time — but a step whose status cannot
#                           go red is not a step. Removed.
#
# A real regression gate needs a base build, a PR build, and a threshold. The
# threshold is not ours to invent, so it is a ticket rather than a guess here.
name: Benchmark CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUCHY_SEED: 42
  RUCHY_BENCHMARK_SEED: 42

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-criterion
        run: cargo install cargo-criterion

      # No `|| true`. If the benchmarks cannot run, this job is red, and that is
      # the whole of what this job asserts: the suite builds and executes. It is
      # not a required check and gates no merge.
      - name: Run benchmarks
        run: cargo criterion --message-format json > benchmark_results.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
