# Advisory exemption ledger — the single place an ignore's EXPIRY lives.
#
# Enforced by src/advisory_ignore_gate.rs, a #[cfg(test)] gate that runs inside
# `ci / gate` (the required check runs `cargo test --lib` on the root crate).
# The gate holds four things:
#
#   1. every advisory ignored in .cargo/audit.toml or deny.toml has an entry here
#   2. every entry carries a non-empty reason and an owner ticket
#   3. every entry carries a `removed_by` date in ISO form
#   4. no entry is past its `removed_by` — the day one is, the gate goes RED
#
# Rule 4 is the point. A standing red that nobody fixes is the class we are
# draining, and an exemption with no expiry is that same red under another name.
#
# `class` distinguishes what cargo-audit itself distinguishes: a `vulnerability`
# fails the audit, an `unmaintained` crate is only a warning. They are not the
# same risk and they do not get the same window.
#
# There is deliberately NO entry here for RUSTSEC-2026-0285 (rustls), the advisory
# that opened SEC-1. It was fixed, not exempted: the advisory's own metadata says
# `patched = [">= 0.23.45"]`, and the lock now carries 0.23.45. An exemption was
# drafted first, on a stale local crates.io index that reported no compatible
# release; refreshing the index showed one. The ledger exists for exemptions that
# are genuinely unavoidable, and this was not one.

ignores:
  # ---------------------------------------------------------------------------
  # INHERITED from deny.toml, which carried these with a reason but no expiry.
  # They are recorded here so the gate can enforce rule 1, NOT because they have
  # been re-reviewed: deny.toml says "Reviewed 2026-03-26" and nothing has looked
  # at them since. The dates below are a FORCING FUNCTION, not an audit result.
  # All five are `unmaintained` warnings rather than vulnerabilities, so they get
  # a 30-day window rather than 14. SEC-3 owns re-reviewing them.
  # ---------------------------------------------------------------------------
  - id: RUSTSEC-2024-0384
    crate: instant
    class: unmaintained
    source: deny
    owner_ticket: SEC-3
    removed_by: "2026-10-20"
    needs_review: true
    reason: "transitive via web-time, no replacement available (deny.toml, reviewed 2026-03-26; not re-reviewed since)"
  - id: RUSTSEC-2024-0436
