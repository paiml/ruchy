# Advisory exemption ledger — the single place an ignore's EXPIRY lives.
#
# Enforced by src/advisory_ignore_gate.rs, a #[cfg(test)] gate that runs inside
# `ci / gate` (the required check runs `cargo test --lib` on the root crate).
# The gate holds these, across four scanned surfaces (.cargo/audit.toml, deny.toml,
# the Makefile and .github/workflows/*.yml):
#
#   1. every advisory ignored on ANY of those four surfaces has an entry here,
#      and no advisory class is suppressed without naming an advisory at all
#   2. every entry carries a non-empty reason, a named OWNER and an owner ticket
#   3. every entry carries a `removed_by` date in ISO form
#   4. no entry is past its `removed_by` — the day one is, the gate goes RED
#
# Rule 4 is the point. A standing red that nobody fixes is the class we are
# draining, and an exemption with no expiry is that same red under another name.
#
# `owner` is a person, not a ticket. An entry carrying only `needs_review: true`
# was an unowned obligation with a date on it, which expires into exactly the red
# nobody consumes that this ledger exists to drain. The review date IS
# `removed_by`; there is no second date field.
#
# `class` distinguishes what cargo-audit itself distinguishes: a `vulnerability`
# fails the audit, an `unmaintained` crate is only a warning. They are not the
# same risk and they do not get the same window.
#
# There is deliberately NO entry here for RUSTSEC-2026-0285 (rustls), the advisory
# that opened SEC-1. It was fixed, not exempted: the advisory's own metadata says
# `patched = [">= 0.23.45"]`, and the lock now carries 0.23.45. An exemption was
# drafted first, on a stale local crates.io index that reported no compatible
# release; refreshing the index showed one. The ledger exists for exemptions that
# are genuinely unavoidable, and this was not one.

ignores:
  # ---------------------------------------------------------------------------
  # INHERITED from deny.toml, which carried these with a reason but no expiry.
  # They are recorded here so the gate can enforce rule 1, NOT because they have
  # been re-reviewed: deny.toml says "Reviewed 2026-03-26" and nothing has looked
  # at them since. The dates below are a FORCING FUNCTION, not an audit result.
  # All five are `unmaintained` warnings rather than vulnerabilities, so they get
  # a 30-day window rather than 14. SEC-3 tracks the work; `owner:` names who is
  # accountable for it. Reassign if that is wrong — the gate only requires that
  # SOMEONE is named, not that it is this someone.
  #
  # There were FIVE. THREE are gone: RUSTSEC-2025-0119 (number_prefix) and
  # RUSTSEC-2025-0134 (rustls-pemfile) named crates that are not in Cargo.lock at
  # all, and cargo-deny already reported both as `advisory-not-detected`. Giving
  # them an owner and a date manufactured two obligations out of two removable
  # lines — the exact standing-red-with-a-name this ledger exists to prevent.
  # Deleting a dead exemption is reading the tool's own output, not re-reviewing
  # an advisory. Found by the second-family review, 2026-09-20.
  #
  # The THIRD, paste (RUSTSEC-2024-0436), survived that pass because it IS in
  # Cargo.lock at 1.0.15 and "not in the lock" was the criterion. The infra
  # session supplied the sharper one: presence in the lock is not sufficient for
  # KEEPING, because a crate can sit in the lock via a path the advisory's range
  # never reaches. The decisive test is to REMOVE the ignore and see whether
  # cargo-deny flips to FAILED. Measured on all three survivors: instant LIVE,
  # bincode LIVE, paste exit 0 — suppressing nothing. Two remain.
  # ---------------------------------------------------------------------------
  - id: RUSTSEC-2024-0384
    crate: instant
    class: unmaintained
    source: deny
    owner_ticket: "paiml/ruchy#275 (SEC-7 master; no open upstream ticket exists for notify 7 -> instant)"
    owner: noah
    removed_by: "2026-12-09"
    reason: "RENEWED 2026-11-13 by quorum Q1 (degraded: same-family), once, no second plain renewal without a fresh quorum. No fixed release: instant 0.1.13 is unmaintained upstream. Path in THIS Cargo.lock (cargo tree -i instant): instant <- notify-types 1.0.1 <- notify 7.0.0 <- jugar-probar 1.0.4 [dev-dependencies of ruchy]. Dev-only edge; blocked on jugar-probar moving to notify 8. Removal test re-run 2026-11-13 on this lock (head dcf6cc8e): ignore removed -> cargo deny check advisories FAILED (exit 1), LIVE."
  - id: RUSTSEC-2025-0141
    crate: bincode
    class: unmaintained
    source: deny
    owner_ticket: "paiml/ruchy#275 (SEC-7 master; no open upstream ticket exists for bincode 1.x; paiml/aprender#6592 is closed)"
    owner: noah
    removed_by: "2026-12-09"
    reason: "RENEWED 2026-11-13 by quorum Q1 (degraded: same-family), once, no second plain renewal without a fresh quorum. No fixed release: bincode 1.3.3 is the final 1.x line, unmaintained. Paths in THIS Cargo.lock (cargo tree -i bincode): bincode <- apr-format 0.65.2 <- aprender-core 0.65.2 <- aprender 0.65.2 <- ruchy (normal dep); bincode <- aprender-core 0.65.2 (direct); bincode <- jugar-probar 1.0.4 [dev-dependencies]. The aprender 0.65 -> 0.72 bump was tried and dropped (pulls aprender-contracts -> serde_yaml, failed the sec_4 bound test). Removal test re-run 2026-11-13 on this lock (head dcf6cc8e): ignore removed -> cargo deny check advisories FAILED (exit 1), LIVE."
  # ---------------------------------------------------------------------------
  # SEC-4 (PMAT-260), 2026-10-15. unsafe-libyaml has no fixed release, and SEC-2
  # already removed every ruchy runtime edge to it. It stays in Cargo.lock through
  # published crates: serde_yaml_ng is a NON-optional build-dependency of
  # aprender-compute and aprender-core through 0.71.4, and serde_yaml arrives via
  # provable-contracts (0.4.0 keeps it, PMAT-262 measured). Removal is PMAT-263,
  # blocked on paiml/aprender#5205 and jugar-probar. `unmaintained` gets the 30-day
  # window. src/advisory_ignore_bound.rs goes red if the crate leaves the lock
  # with the ignore still here, if a new crate links it, or if ruchy gains a
  # non-dev edge to serde_yaml / serde_yaml_ng.
  # ---------------------------------------------------------------------------
  - id: RUSTSEC-2024-0449
    crate: unsafe-libyaml
    class: unmaintained
    source: deny
    owner_ticket: "PMAT-263 = paiml/ruchy#263 (open)"
    owner: noah
    removed_by: "2026-12-09"
    reason: "RE-REVIEWED 2026-11-13 by quorum Q1; renewed once. No fixed release (unsafe-libyaml unmaintained). Paths in THIS Cargo.lock (cargo tree -i unsafe-libyaml): serde_yaml 0.9.34 <- provable-contracts 0.3.1 (dev + build-dep of ruchy); serde_yaml_ng 0.10.0 <- jugar-probar 1.0.4 (dev), aprender-compute 0.65.2 and aprender-core 0.65.2 (build-deps), ruchy (dev). Bounded by src/advisory_ignore_bound.rs. Removal test re-run 2026-11-13 on this lock (head dcf6cc8e): ignore removed -> cargo deny check advisories FAILED (exit 1), LIVE. No second plain renewal without a fresh quorum. Upstream owner ticket named by ruchy#263: aprender#5205."
