  acceptance_criteria:
  - 'OPERATOR RULING 2026-09-20: ''Budget: k_measured=118 against K=100, andon at 80. The row overran its cap by 18% without a PARTIAL(andon). The harness should have stopped the line at 80 — if it did not, that is a harness ask.'' MEASURED on ruchy RHL-0: goal.sh set --K 100 --khat 80 was called at Phase 1 and statusline.sh measured k=118 by the end, with no andon fired and no PARTIAL(andon) emitted. Two things to separate before fixing: (1) UNITS — statusline.sh''s k counts distinct assistant message ids INCLUDING intra-turn tool-call messages, while K-hat is budgeted in orchestrator turns (~72 here). 118 vs 72 is not a 64% overrun, it is two different measures. Decide which one K governs and make goal.sh and statusline.sh agree. (2) ENFORCEMENT — whichever unit is chosen, nothing currently interrupts at 0.8K. The skill says ''turns >= 0.8K and gate != PASS -> andon: commit WIP, push, gh pr create --draft, emit PARTIAL(andon), stop'', but that is a rule the MODEL is asked to follow, with no hook behind it. A PreToolUse hook that refuses once k_measured >= K, the way the progress guard already refuses a third identical call, would make the cap real. Filed from ruchy; owner is paiml-implement (see LANE-1, filed the same day).'
