- id: CIBASE-1
  github_issue: null
  item_type: task
  title: 'CIBASE-1: Baseline Comparison fails on every PR, passes only on main'
  status: completed
  priority: medium
  assigned_to: null
  created: 2026-09-20 12:05:11+00:00
  updated: 2026-09-20T17:01:04Z
  spec: null
  acceptance_criteria:
  - 'MEASURED 2026-09-20 via gh run list --workflow=benchmarks.yml: the ''Baseline Comparison'' job fails on PMAT-135, PMAT-139, PMAT-140 and RHL-0 — every recent BRANCH — and succeeds only on main. Failing step is ''Checkout baseline'': .github/workflows/benchmarks.yml:82 runs ''git checkout ${{ github.base_ref }} -- benches/'', but actions/checkout fetches only the PR head, so the base ref does not exist locally and the checkout fails in ~14s before any benchmark runs. Consequence: the job has never compared anything on a PR; it is a red that nobody consumes, and it is not a required context (the only required check is ''gate''), so it silently stays red. Fix: fetch the base ref first (fetch-depth 0, or an explicit git fetch origin $GITHUB_BASE_REF), or drop the job. Note the PR that fixes it touches .github/workflows and so needs a web-UI merge click. Filed by RHL-0; not fixed there.'
  phases: []
  subtasks: []
  estimated_effort: null
  labels:
  - kind:code
  - ci-debt
  - filed-by:RHL-0
  notes: 'Landed: merged e382f9ab (#228), 2026-09-20. MEASURED 2026-09-20. Failure is ''fatal: invalid reference: main'', exit 128, at the FIRST step: actions/checkout leaves the base branch as origin/main, not main, so ''git checkout main -- benches/'' cannot resolve. Full paginated history: 390 runs — 306 push/success, 3 push/failure, and 81 pull_request/FAILURE across 33 distinct branches, with ZERO pull_request successes ever. (An earlier note said 17 of 17; that was gh run list default page size, not a count.) It has never compared anything on any PR. Not a required check (only ''gate'' is) and no consumer reads its artifacts — grep for benchmark_results.json / benchmark_report.md / benchmark-results outside the workflow returns nothing. Classified FC-5 per infra''s ruling (a gate that grades an artifact older than its sources), with their note that the stale thing here is a REF rather than a binary; it is not FC-1, because it is not a control that passed wrongly, it is a comparison that never happened. Two further layers found while fixing: ''git checkout <ref> -- benches/'' swaps only benches/ and leaves src/ at the PR''s code, so even a working version would have benchmarked the PR''s library with the base''s harness; and the ''Comparison Results'' output (Cohen''s d, threshold |d| > 0.5) was echoed strings with no implementation. Removed rather than repaired — a real gate needs a base build, a PR build and a threshold, and inventing a threshold is a STOP condition. Filed as BENCH-1. Also removed in the same pass: a ''Generate benchmark report'' step that wrote a table header and never a row under a Statistical Summary heading, a ''Check for regressions'' step that was echo plus two comments claiming a 10% threshold, and a ''|| true'' that made the benchmark run unable to go red.'
