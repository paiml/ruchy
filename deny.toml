# cargo-deny configuration
# Deployed from paiml/infra — do not edit manually.
# Spec: docs/specifications/unified-ci-pipeline.md

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
ignore = [
    # Unmaintained transitive deps with no available fix.
    # Reviewed 2026-03-26 — all are deep transitive, no direct usage.
    # SEC-1/RHL-13, 2026-09-20: THREE were removed from this list —
    # number_prefix (RUSTSEC-2025-0119), rustls-pemfile (RUSTSEC-2025-0134) and
    # paste (RUSTSEC-2024-0436). Neither crate is in
    # Cargo.lock any more, and cargo-deny reported both as
    # `warning[advisory-not-detected] ... no crate matched advisory criteria`.
    # The first two named crates that had already left the tree. paste is the
    # interesting one: it IS in Cargo.lock at 1.0.15, so the "not in the lock"
    # criterion kept it — and that criterion is not sufficient. The decisive test,
    # from the infra session: REMOVE the ignore and see whether cargo-deny flips
    # to FAILED. Measured 2026-09-20 on all three survivors —
    #   instant  (RUSTSEC-2024-0384): removed -> exit 1, LIVE
    #   paste    (RUSTSEC-2024-0436): removed -> exit 0, suppresses NOTHING
    #   bincode  (RUSTSEC-2025-0141): removed -> exit 1, LIVE
    # paste sits outside cargo-deny's default-feature graph, so its ignore was
    # inert. Presence in the lock is sufficient to DELETE nothing; only the
    # removal test distinguishes a live exemption from a dead one.
    # Every id below must carry an entry in docs/audits/advisory-ignores.yaml
    # with an owner and a removed_by date; src/advisory_ignore_gate.rs enforces it.
    { id = "RUSTSEC-2024-0384", reason = "instant: transitive via web-time, no replacement available" },
    { id = "RUSTSEC-2025-0141", reason = "bincode: transitive, widely used, no drop-in replacement" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "MIT-0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["paiml"]
