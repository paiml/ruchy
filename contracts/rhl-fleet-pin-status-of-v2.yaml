metadata:
  version: "2.0.0"
  author: "RHL-16"
  description: "RHL-16 v2 contract for vocabulary term 'pin status of' (fleet v2, kind: measure)"
  crate: "ruchy"
  references:
    - "RHL-001 §3.4"

equations:
  pin_status_of_shape:
    formula: "kind('pin status of') = measure ∧ gives('pin status of') = Text"
    domain: "t ∈ vocabulary fleet v2 terms named 'pin status of'"
    invariants:
      - "term kind is one of {noun, measure, action, unit, entity} (RHL-001 §3.4)"
      - "term result type ('gives') is Text"
      - "term declares effect 'read host' (RHL-001 §3.1 rule 6)"
      - "lowers_to is the unbound marker `[U]` or a `<module>::<name>` that resolves to one function of vocab/runtime/<module>.ruchy (RHL-4, Amendment A4)"

proof_obligations:
  - type: invariant
    property: "Term 'pin status of' carries a contract template on disk (F6)"
    formal: "contract('pin status of') exists"
    applies_to: all
  - type: invariant
    property: "Term 'pin status of' kind is drawn from RHL's closed kind list"
    formal: "kind('pin status of') ∈ {noun, measure, action, unit, entity}"
    applies_to: all

falsification_tests:
  - id: FALSIFY-RHL-FLEET-PIN-STATUS-OF-V2-001
    rule: "Vocabulary term contract must exist (RHL-001 F6)"
    test: "test_rhl16_v2_every_term_has_an_existing_contract"
    prediction: "verified"
    if_fails: "Contract violation — RHL-001 F6: term 'pin status of' has no contract template"

  - id: FALSIFY-RHL-FLEET-PIN-STATUS-OF-V2-002
    rule: "Vocabulary term kind is drawn from the closed list"
    test: "test_rhl16_v2_carries_every_v1_term_forward"
    prediction: "verified"
    if_fails: "Contract violation — term 'pin status of' kind not in {noun, measure, action, unit, entity}"

# NOT APPLICABLE, declared because `pv validate` requires the block. A vocabulary
# term contract states a property of YAML bytes on disk; Kani symbolically executes
# Rust and cannot reach a file system. Declaring a harness that does not exist is the
# practice KANIDEBT-1 was filed against, so it is marked rather than pretended.
kani_harnesses:
  - id: KANI-RHL-FLEET-PIN-STATUS-OF-V2-001
    obligation: PO-RHL-FLEET-PIN-STATUS-OF-V2-001
    property: "NOT APPLICABLE — a vocabulary term contract is a property of YAML bytes on disk, outside Kani's reach"
    bound: 1
    strategy: bounded_int
    harness: none
    status: declared_not_implemented
    discharged_by: "test_rhl16_v2_every_term_has_an_existing_contract"

qa_gate:
  id: QA-RHL-FLEET-PIN-STATUS-OF-V2
  name: "rhl fleet vocabulary v2 term: pin status of"
  min_coverage: 1.0
  max_complexity: 10
  required_tests:
    - test_rhl16_v2_every_term_has_an_existing_contract
    - test_rhl16_v2_carries_every_v1_term_forward
    - test_rhl4c_v2_lowers_to_is_unbound_or_resolves_through_the_runtime
