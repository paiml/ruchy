metadata:
  version: "2.0.0"
  author: "RHL-16"
  description: "RHL-16 v2 contract (new in v2) for vocabulary term 'ticket count' (tickets v2, kind: measure)"
  crate: "ruchy"
  references:
    - "RHL-001 §3.4"

equations:
  ticket_count_shape:
    formula: "kind('ticket count') = measure ∧ gives('ticket count') = Count"
    domain: "t ∈ vocabulary tickets v2 terms named 'ticket count'"
    invariants:
      - "term kind is one of {noun, measure, action, unit, entity} (RHL-001 §3.4)"
      - "term result type ('gives') is Count"
      - "term declares NO effect: it is the number of tickets this run files, read from the run's own plan, so no `may` line is needed (RHL-16)"
      - "term takes no argument"
      - "lowers_to stays the unbound marker `[U]` until RHL-4 — RHL-16 does not bind lowering"

proof_obligations:
  - type: invariant
    property: "Term 'ticket count' carries a contract template on disk (F6)"
    formal: "contract('ticket count') exists"
    applies_to: all
  - type: invariant
    property: "Term 'ticket count' kind is drawn from RHL's closed kind list"
    formal: "kind('ticket count') ∈ {noun, measure, action, unit, entity}"
    applies_to: all

falsification_tests:
  - id: FALSIFY-RHL-TICKETS-TICKET-COUNT-V2-001
    rule: "Vocabulary term contract must exist (RHL-001 F6)"
    test: "test_rhl16_v2_every_term_has_an_existing_contract"
    prediction: "verified"
    if_fails: "Contract violation — RHL-001 F6: term 'ticket count' has no contract template"

  - id: FALSIFY-RHL-TICKETS-TICKET-COUNT-V2-002
    rule: "Vocabulary term kind is drawn from the closed list"
    test: "test_rhl16_v2_file_ticket_has_attributes_and_ticket_count_has_no_effect"
    prediction: "verified"
    if_fails: "Contract violation — term 'ticket count' kind not in {noun, measure, action, unit, entity}"

# NOT APPLICABLE, declared because `pv validate` requires the block. A vocabulary
# term contract states a property of YAML bytes on disk; Kani symbolically executes
# Rust and cannot reach a file system. Declaring a harness that does not exist is the
# practice KANIDEBT-1 was filed against, so it is marked rather than pretended.
kani_harnesses:
  - id: KANI-RHL-TICKETS-TICKET-COUNT-V2-001
    obligation: PO-RHL-TICKETS-TICKET-COUNT-V2-001
    property: "NOT APPLICABLE — a vocabulary term contract is a property of YAML bytes on disk, outside Kani's reach"
    bound: 1
    strategy: bounded_int
    harness: none
    status: declared_not_implemented
    discharged_by: "test_rhl16_v2_every_term_has_an_existing_contract"

qa_gate:
  id: QA-RHL-TICKETS-TICKET-COUNT-V2
  name: "rhl tickets vocabulary v2 term: ticket count"
  min_coverage: 1.0
  max_complexity: 10
  required_tests:
    - test_rhl16_v2_every_term_has_an_existing_contract
    - test_rhl16_v2_file_ticket_has_attributes_and_ticket_count_has_no_effect
    - test_rhl16_v2_lowers_to_and_sigma_entity_stay_unbound
    - test_rhl16_measure_without_effect_needs_no_may_line
