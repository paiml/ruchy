metadata:
  version: "1.0.0"
  author: "Sovereign AI Stack"
  description: "Expression dispatch contract for the Ruchy interpreter"
  crate: "ruchy"
  references:
    - "Pierce, Types and Programming Languages, 2002"

equations:
  dispatch_totality:
    formula: "∀k ∈ ExprKind: eval_expr_kind(k) ∈ Ok ∪ Err"
    domain: "k ∈ ExprKind (93 variants)"
    invariants:
      - "Every ExprKind variant reaches an eval_* handler"
      - "No ExprKind variant reaches ⊥ (panic, abort, or divergence)"
    preconditions:
      - "expr_kind is a well-formed ExprKind node"
    postconditions:
      - "result is Ok(Value) or Err(InterpreterError), never ⊥"
    lean_theorem: "Theorems.Dispatch_totality"

  dispatch_determinism:
    formula: "eval_expr_kind(k) = eval_expr_kind(k)"
    domain: "k ∈ ExprKind (93 variants), evaluated in equal interpreter states"
    invariants:
      - "Dispatch is a function of the ExprKind and the interpreter state"
    preconditions:
      - "expr_kind is a well-formed ExprKind node"
    postconditions:
      - "two evaluations from equal fresh interpreter states render the same Result"
    lean_theorem: "Theorems.Dispatch_determinism"

proof_obligations:
  - type: completeness
    property: "Every ExprKind variant is dispatched to a handler"
    formal: "∀k ∈ ExprKind: eval_expr_kind(k) ∈ Ok ∪ Err"
    applies_to: all
  - type: determinism
    property: "Dispatch from equal states yields equal results"
    formal: "eval_expr_kind(k) = eval_expr_kind(k)"
    applies_to: all

falsification_tests:
  - id: FALSIFY-EVAL-DISPATCH-001
    rule: "Eval dispatch totality"
    test: "test_pmat_097_eval_dispatch_totality_all_variants"
    prediction: "verified"
    if_fails: "Contract violation — an ExprKind variant panics or diverges in eval_expr_kind"
  - id: FALSIFY-EVAL-DISPATCH-002
    rule: "Eval dispatch determinism"
    test: "test_pmat_097_eval_dispatch_determinism_all_variants"
    prediction: "verified"
    if_fails: "Contract violation — eval_expr_kind depends on hidden state"
  - id: FALSIFY-EVAL-DISPATCH-003
    rule: "Variant coverage is exhaustive"
    test: "test_pmat_097_variants_exhaustive_over_exprkind"
    prediction: "verified"
    if_fails: "A new ExprKind variant is untested — coverage of the domain is stale"

kani_harnesses:
  - id: KANI-EVAL-DISPATCH-001
    obligation: PO-EVAL-DISPATCH-001
    property: "Eval dispatch totality"
    bound: 8
    strategy: bounded_int
    harness: verify_eval_dispatch_totality

qa_gate:
  id: QA-EVAL-DISPATCH
  name: "eval dispatch contract"
  min_coverage: 0.90
  max_complexity: 20
  required_tests:
    - "test_pmat_097_eval_dispatch_totality_all_variants"
    - "test_pmat_097_eval_dispatch_determinism_all_variants"
