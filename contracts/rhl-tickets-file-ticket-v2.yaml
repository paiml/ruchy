metadata:
  version: "2.0.0"
  author: "RHL-16"
  description: "RHL-16 v2 contract for vocabulary term 'file ticket' (tickets v2, kind: action)"
  crate: "ruchy"
  references:
    - "RHL-001 §3.4"

equations:
  file_ticket_shape:
    formula: "kind('file ticket') = action ∧ gives('file ticket') = Ticket"
    domain: "t ∈ vocabulary tickets v2 terms named 'file ticket'"
    invariants:
      - "term kind is one of {noun, measure, action, unit, entity} (RHL-001 §3.4)"
      - "term result type ('gives') is Ticket"
      - "term declares effect 'write tickets' (RHL-001 §3.1 rule 6)"
      - "v2: attributes('file ticket') = [title: Text, label: Text]; each line of its `with … end` block names one of them and gives a value of its type (RHL-16)"
      - "lowers_to stays the unbound marker `[U]` until RHL-4 — RHL-16 does not bind lowering"

proof_obligations:
  - type: invariant
    property: "Term 'file ticket' carries a contract template on disk (F6)"
    formal: "contract('file ticket') exists"
    applies_to: all
  - type: invariant
    property: "Term 'file ticket' kind is drawn from RHL's closed kind list"
    formal: "kind('file ticket') ∈ {noun, measure, action, unit, entity}"
    applies_to: all

falsification_tests:
  - id: FALSIFY-RHL-TICKETS-FILE-TICKET-V2-001
    rule: "Vocabulary term contract must exist (RHL-001 F6)"
    test: "test_rhl16_v2_every_term_has_an_existing_contract"
    prediction: "verified"
    if_fails: "Contract violation — RHL-001 F6: term 'file ticket' has no contract template"

  - id: FALSIFY-RHL-TICKETS-FILE-TICKET-V2-002
    rule: "Vocabulary term kind is drawn from the closed list"
    test: "test_rhl16_v2_carries_every_v1_term_forward"
    prediction: "verified"
    if_fails: "Contract violation — term 'file ticket' kind not in {noun, measure, action, unit, entity}"

# NOT APPLICABLE, declared because `pv validate` requires the block. A vocabulary
# term contract states a property of YAML bytes on disk; Kani symbolically executes
# Rust and cannot reach a file system. Declaring a harness that does not exist is the
# practice KANIDEBT-1 was filed against, so it is marked rather than pretended.
kani_harnesses:
  - id: KANI-RHL-TICKETS-FILE-TICKET-V2-001
    obligation: PO-RHL-TICKETS-FILE-TICKET-V2-001
    property: "NOT APPLICABLE — a vocabulary term contract is a property of YAML bytes on disk, outside Kani's reach"
    bound: 1
    strategy: bounded_int
    harness: none
    status: declared_not_implemented
    discharged_by: "test_rhl16_v2_every_term_has_an_existing_contract"

qa_gate:
  id: QA-RHL-TICKETS-FILE-TICKET-V2
  name: "rhl tickets vocabulary v2 term: file ticket"
  min_coverage: 1.0
  max_complexity: 10
  required_tests:
    - test_rhl16_v2_every_term_has_an_existing_contract
    - test_rhl16_v2_carries_every_v1_term_forward
    - test_rhl16_v2_lowers_to_and_sigma_entity_stay_unbound
    - test_rhl16_v2_file_ticket_has_attributes_and_ticket_count_has_no_effect
    - test_rhl16_attribute_declared_is_ok
    - test_rhl16_attribute_unknown_is_v001_listing_the_declared_attributes
    - test_rhl16_attribute_wrong_type_is_t002
