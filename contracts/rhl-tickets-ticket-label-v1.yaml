metadata:
  version: "1.0.0"
  author: "RHL-0"
  description: "RHL-0 pre-registered contract for vocabulary term 'ticket label' (tickets v1, kind: noun)"
  crate: "ruchy"
  references:
    - "RHL-001 §3.4"

equations:
  ticket_label_shape:
    formula: "kind('ticket label') = noun ∧ gives('ticket label') = Text"
    domain: "t ∈ vocabulary tickets v1 terms named 'ticket label'"
    invariants:
      - "term kind is one of {noun, measure, action, unit, entity} (RHL-001 §3.4)"
      - "term result type ('gives') is Text"
      - "lowers_to stays the unbound marker `[U]` until RHL-3 — RHL-0 does not bind lowering"

proof_obligations:
  - type: invariant
    property: "Term 'ticket label' carries a contract template on disk (F6)"
    formal: "contract('ticket label') exists"
    applies_to: all
  - type: invariant
    property: "Term 'ticket label' kind is drawn from RHL's closed kind list"
    formal: "kind('ticket label') ∈ {noun, measure, action, unit, entity}"
    applies_to: all

falsification_tests:
  - id: FALSIFY-RHL-TICKETS-TICKET-LABEL-001
    rule: "Vocabulary term contract must exist (RHL-001 F6)"
    test: "test_rhl_vocab_0_all_terms_have_existing_contract"
    prediction: "verified"
    if_fails: "Contract violation — RHL-001 F6: term 'ticket label' has no contract template"

  - id: FALSIFY-RHL-TICKETS-TICKET-LABEL-002
    rule: "Vocabulary term kind is drawn from the closed list"
    test: "test_rhl_vocab_0_kind_is_closed_list"
    prediction: "verified"
    if_fails: "Contract violation — term 'ticket label' kind not in {noun, measure, action, unit, entity}"

kani_harnesses:
  - id: KANI-RHL-TICKETS-TICKET-LABEL-001
    obligation: PO-RHL-TICKETS-TICKET-LABEL-001
    property: "Term 'ticket label' contract template is well-formed YAML with a metadata block"
    bound: 1
    strategy: exhaustive
    harness: verify_rhl_tickets_ticket_label_contract

qa_gate:
  id: QA-RHL-TICKETS-TICKET-LABEL
  name: "rhl tickets vocabulary term: ticket label"
  min_coverage: 1.0
  max_complexity: 10
  required_tests:
    - test_rhl_vocab_0_all_terms_have_existing_contract
    - test_rhl_vocab_0_kind_is_closed_list
    - test_rhl_vocab_0_lowers_to_is_unbound
