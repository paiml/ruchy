metadata:
  version: "2.0.0"
  author: "RHL-16"
  description: "RHL-16 v2 contract for vocabulary term 'runner' (fleet v2, kind: entity)"
  crate: "ruchy"
  references:
    - "RHL-001 §3.4"

equations:
  runner_closed_world:
    formula: "instances('runner') = { x : x ∈ glob('fleet/runners/*.yaml') }"
    domain: "t ∈ vocabulary fleet v2 terms named 'runner'"
    invariants:
      - "term kind is entity (RHL-001 §3.4)"
      - "every instance of 'runner' comes from the declared closed-world source 'fleet/runners/*.yaml'"
      - "an undeclared instance is a compile error naming the nearest candidate (RHL-001 §3.4)"
      - "lowers_to stays the unbound marker `[U]` until RHL-4 — RHL-16 does not bind lowering"

proof_obligations:
  - type: invariant
    property: "Term 'runner' carries a contract template on disk (F6)"
    formal: "contract('runner') exists"
    applies_to: all
  - type: completeness
    property: "Every instance of entity term 'runner' is enumerable from its closed-world source"
    formal: "∀x. valid('runner', x) ⟺ x ∈ glob('fleet/runners/*.yaml')"
    applies_to: all

falsification_tests:
  - id: FALSIFY-RHL-FLEET-RUNNER-V2-001
    rule: "Vocabulary term contract must exist (RHL-001 F6)"
    test: "test_rhl16_v2_every_term_has_an_existing_contract"
    prediction: "verified"
    if_fails: "Contract violation — RHL-001 F6: term 'runner' has no contract template"

  - id: FALSIFY-RHL-FLEET-RUNNER-V2-002
    rule: "Entity term declares its closed-world instances_from source"
    test: "test_rhl16_v2_carries_every_v1_term_forward"
    prediction: "verified"
    if_fails: "Contract violation — entity term 'runner' has no instances_from source"

# NOT APPLICABLE, declared because `pv validate` requires the block. A vocabulary
# term contract states a property of YAML bytes on disk; Kani symbolically executes
# Rust and cannot reach a file system. Declaring a harness that does not exist is the
# practice KANIDEBT-1 was filed against, so it is marked rather than pretended.
kani_harnesses:
  - id: KANI-RHL-FLEET-RUNNER-V2-001
    obligation: PO-RHL-FLEET-RUNNER-V2-001
    property: "NOT APPLICABLE — a vocabulary term contract is a property of YAML bytes on disk, outside Kani's reach"
    bound: 1
    strategy: bounded_int
    harness: none
    status: declared_not_implemented
    discharged_by: "test_rhl16_v2_every_term_has_an_existing_contract"

qa_gate:
  id: QA-RHL-FLEET-RUNNER-V2
  name: "rhl fleet vocabulary v2 term: runner"
  min_coverage: 1.0
  max_complexity: 10
  required_tests:
    - test_rhl16_v2_every_term_has_an_existing_contract
    - test_rhl16_v2_carries_every_v1_term_forward
    - test_rhl16_v2_lowers_to_and_sigma_entity_stay_unbound
