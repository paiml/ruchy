metadata:
  version: "1.0.0"
  author: "RHL-0"
  description: "RHL-0 pre-registered contract for vocabulary term 'host' (fleet v1, kind: entity)"
  crate: "ruchy"
  references:
    - "RHL-001 §3.4"

equations:
  host_closed_world:
    formula: "instances('host') = { x : x ∈ glob('machines/*/forjar.yaml') }"
    domain: "t ∈ vocabulary fleet v1 terms named 'host'"
    invariants:
      - "term kind is entity (RHL-001 §3.4)"
      - "every instance of 'host' comes from the declared closed-world source 'machines/*/forjar.yaml'"
      - "an undeclared instance is a compile error naming the nearest candidate (RHL-001 §3.4)"
      - "lowers_to stays the unbound marker `[U]` until RHL-3 — RHL-0 does not bind lowering"

proof_obligations:
  - type: invariant
    property: "Term 'host' carries a contract template on disk (F6)"
    formal: "contract('host') exists"
    applies_to: all
  - type: completeness
    property: "Every instance of entity term 'host' is enumerable from its closed-world source"
    formal: "∀x. valid('host', x) ⟺ x ∈ glob('machines/*/forjar.yaml')"
    applies_to: all

falsification_tests:
  - id: FALSIFY-RHL-FLEET-HOST-001
    rule: "Vocabulary term contract must exist (RHL-001 F6)"
    test: "test_rhl_vocab_0_all_terms_have_existing_contract"
    prediction: "verified"
    if_fails: "Contract violation — RHL-001 F6: term 'host' has no contract template"

  - id: FALSIFY-RHL-FLEET-HOST-002
    rule: "Entity term declares its closed-world instances_from source"
    test: "test_rhl_vocab_0_entity_terms_declare_instances_from"
    prediction: "verified"
    if_fails: "Contract violation — entity term 'host' has no instances_from source"

kani_harnesses:
  - id: KANI-RHL-FLEET-HOST-001
    obligation: PO-RHL-FLEET-HOST-001
    property: "Term 'host' contract template is well-formed YAML with a metadata block"
    bound: 1
    strategy: exhaustive
    harness: verify_rhl_fleet_host_contract

qa_gate:
  id: QA-RHL-FLEET-HOST
  name: "rhl fleet vocabulary term: host"
  min_coverage: 1.0
  max_complexity: 10
  required_tests:
    - test_rhl_vocab_0_all_terms_have_existing_contract
    - test_rhl_vocab_0_entity_terms_declare_instances_from
    - test_rhl_vocab_0_lowers_to_is_unbound
