metadata:
  version: "2.0.0"
  author: "RHL-16"
  description: "RHL-16 v2 contract for vocabulary term 'tickets filed in' (tickets v2, kind: measure)"
  crate: "ruchy"
  references:
    - "RHL-001 §3.4"

equations:
  tickets_filed_in_shape:
    formula: "kind('tickets filed in') = measure ∧ gives('tickets filed in') = Count"
    domain: "t ∈ vocabulary tickets v2 terms named 'tickets filed in'"
    invariants:
      - "term kind is one of {noun, measure, action, unit, entity} (RHL-001 §3.4)"
      - "term result type ('gives') is Count"
      - "term declares effect 'read tickets' (RHL-001 §3.1 rule 6)"
      - "lowers_to stays the unbound marker `[U]` until RHL-4 — RHL-16 does not bind lowering"

proof_obligations:
  - type: invariant
    property: "Term 'tickets filed in' carries a contract template on disk (F6)"
    formal: "contract('tickets filed in') exists"
    applies_to: all
  - type: invariant
    property: "Term 'tickets filed in' kind is drawn from RHL's closed kind list"
    formal: "kind('tickets filed in') ∈ {noun, measure, action, unit, entity}"
    applies_to: all

falsification_tests:
  - id: FALSIFY-RHL-TICKETS-TICKETS-FILED-IN-V2-001
    rule: "Vocabulary term contract must exist (RHL-001 F6)"
    test: "test_rhl16_v2_every_term_has_an_existing_contract"
    prediction: "verified"
    if_fails: "Contract violation — RHL-001 F6: term 'tickets filed in' has no contract template"

  - id: FALSIFY-RHL-TICKETS-TICKETS-FILED-IN-V2-002
    rule: "Vocabulary term kind is drawn from the closed list"
    test: "test_rhl16_v2_carries_every_v1_term_forward"
    prediction: "verified"
    if_fails: "Contract violation — term 'tickets filed in' kind not in {noun, measure, action, unit, entity}"

# NOT APPLICABLE, declared because `pv validate` requires the block. A vocabulary
# term contract states a property of YAML bytes on disk; Kani symbolically executes
# Rust and cannot reach a file system. Declaring a harness that does not exist is the
# practice KANIDEBT-1 was filed against, so it is marked rather than pretended.
kani_harnesses:
  - id: KANI-RHL-TICKETS-TICKETS-FILED-IN-V2-001
    obligation: PO-RHL-TICKETS-TICKETS-FILED-IN-V2-001
    property: "NOT APPLICABLE — a vocabulary term contract is a property of YAML bytes on disk, outside Kani's reach"
    bound: 1
    strategy: bounded_int
    harness: none
    status: declared_not_implemented
    discharged_by: "test_rhl16_v2_every_term_has_an_existing_contract"

qa_gate:
  id: QA-RHL-TICKETS-TICKETS-FILED-IN-V2
  name: "rhl tickets vocabulary v2 term: tickets filed in"
  min_coverage: 1.0
  max_complexity: 10
  required_tests:
    - test_rhl16_v2_every_term_has_an_existing_contract
    - test_rhl16_v2_carries_every_v1_term_forward
    - test_rhl16_v2_lowers_to_and_sigma_entity_stay_unbound
